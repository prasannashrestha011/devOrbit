services:
  devorbit-db:
    image: postgres:17
    container_name: devorbit-db
    environment:
      POSTGRES_DB: devorbit
      POSTGRES_USER: devorbit
      POSTGRES_PASSWORD: ${DEVORBIT_DB_PASSWORD:?Set DEVORBIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devorbit -d devorbit" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
