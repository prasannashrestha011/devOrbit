name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devorbit_test
          POSTGRES_USER: devorbit
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devorbit -d devorbit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEVORBIT_TEST_DATABASE_URL: postgres://devorbit:ci-only-password@127.0.0.1:5432/devorbit_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install terminal dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Validate Docker Compose
        env:
          DEVORBIT_DB_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o "$RUNNER_TEMP/devorbit" ./cmd/devorbit

  desktop:
    name: Desktop checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release versions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          desktop = Path("desktop")
          version = json.loads((desktop / "src-tauri/tauri.conf.json").read_text())["version"]
          assert json.loads((desktop / "package.json").read_text())["version"] == version, "package.json version differs"
          lock = json.loads((desktop / "package-lock.json").read_text())
          assert lock["version"] == lock["packages"][""]["version"] == version, "npm lockfile version differs"
          assert tomllib.loads((desktop / "src-tauri/Cargo.toml").read_text())["package"]["version"] == version, "Cargo.toml version differs"
          packages = tomllib.loads((desktop / "src-tauri/Cargo.lock").read_text())["package"]
          assert next(p["version"] for p in packages if p["name"] == "devorbit-desktop") == version, "Cargo.lock version differs"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Release tag must match the app version"
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

  package:
    name: Package ${{ matrix.platform }}
    needs: [backend, desktop]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb
            installer: deb/*.deb
            executable: devorbit
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis
            installer: nsis/*-setup.exe
            executable: devorbit.exe
          - platform: macos-arm64
            runner: macos-15
            bundles: dmg
            installer: dmg/*.dmg
            executable: devorbit
          - platform: macos-x64
            runner: macos-15-intel
            bundles: dmg
            installer: dmg/*.dmg
            executable: devorbit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
        working-directory: desktop
      - name: Generate platform icons from the existing app icon
        run: npm run tauri -- icon src-tauri/icons/icon.png
        working-directory: desktop
      - name: Build desktop installer
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri -- build --bundles "$BUNDLES" --config '{"bundle":{"icon":["icons/icon.png","icons/icon.ico","icons/icon.icns"]}}' -- --locked
        working-directory: desktop
      - name: Build backend
        env:
          BACKEND_EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir -p "$RUNNER_TEMP/backend"
          go build -trimpath -o "$RUNNER_TEMP/backend/$BACKEND_EXECUTABLE" ./cmd/devorbit
        working-directory: server
      - name: Collect release files
        env:
          PLATFORM: ${{ matrix.platform }}
          INSTALLER: ${{ matrix.installer }}
          BACKEND_EXECUTABLE: ${{ matrix.executable }}
        run: |
          version=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          test -s "$RUNNER_TEMP/backend/$BACKEND_EXECUTABLE"
          mkdir -p "$RUNNER_TEMP/backend/server" release
          cp server/compose.yaml server/.env.example "$RUNNER_TEMP/backend/server/"
          cp docs/install-release.md "$RUNNER_TEMP/backend/README.md"
          tar -czf "release/devorbit-backend-$version-$PLATFORM.tar.gz" -C "$RUNNER_TEMP/backend" .
          # The matrix supplies this glob; a missing installer must fail the job.
          cp desktop/src-tauri/target/release/bundle/$INSTALLER release/
      - uses: actions/upload-artifact@v7
        with:
          name: devorbit-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Draft GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: devorbit-*
          path: release
          merge-multiple: true
      - name: Check assets and generate checksums
        working-directory: release
        run: |
          test "$(find . -maxdepth 1 -name 'devorbit-backend-*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*-setup.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          sha256sum *.tar.gz *.deb *.exe *.dmg > SHA256SUMS
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft \
              --title "DevOrbit $GITHUB_REF_NAME" --notes-file docs/install-release.md
          fi
